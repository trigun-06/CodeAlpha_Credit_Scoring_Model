<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="ambientWarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E05626" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0" />
    </radialGradient>

    <!-- Credit Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F57C4A" />
      <stop offset="50%" stop-color="#E05626" />
      <stop offset="100%" stop-color="#C53D12" />
    </linearGradient>

    <!-- Card Overlay Sheen -->
    <linearGradient id="cardSheen" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald Success Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Surface Card Gradient -->
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFDF9" />
    </linearGradient>

    <!-- Gauge Gradient -->
    <linearGradient id="gaugeArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E05626" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E05626" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#803815" flood-opacity="0.14" />
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="14" stdDeviation="16" flood-color="#7A2D0D" flood-opacity="0.22" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.25" />
    </filter>

    <filter id="goldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#D97706" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background Ambient Aura -->
  <circle cx="260" cy="170" r="150" fill="url(#ambientWarmGlow)" />

  <!-- Background Animated Radar Rings -->
  <g opacity="0.6">
    <ellipse cx="260" cy="220" rx="200" ry="60" stroke="#EAE1D5" stroke-width="1.5" stroke-dasharray="4 6" />
    <ellipse cx="260" cy="220" rx="140" ry="42" stroke="#EAE1D5" stroke-width="1.5" />
    <ellipse cx="260" cy="220" rx="80" ry="24" stroke="#E05626" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Bottom Isometric Base / Stage Plate -->
  <g filter="url(#softShadow)">
    <path d="M120 220 L260 265 L400 220 L260 175 Z" fill="url(#surfaceGrad)" stroke="#EAE1D5" stroke-width="1.5" />
    <!-- Pedestal thickness -->
    <path d="M120 220 L260 265 L260 275 L120 230 Z" fill="#EAE0D3" opacity="0.8" />
    <path d="M260 265 L400 220 L400 230 L260 275 Z" fill="#DDD0C2" opacity="0.9" />
  </g>

  <!-- Left Mini Dashboard: Credit Trend & Score (Glass Card) -->
  <g transform="translate(65, 80)" filter="url(#softShadow)">
    <rect x="0" y="0" width="155" height="120" rx="14" fill="url(#surfaceGrad)" stroke="#EAE1D5" stroke-width="1.2" />
    
    <!-- Header of mini card -->
    <circle cx="18" cy="18" r="4" fill="#15803D" />
    <text x="28" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#2A221C">CREDIT SCORE</text>
    <text x="18" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#15803D">795</text>
    <text x="64" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#059669">FICO &bull; PRIME</text>

    <!-- Mini Area Chart -->
    <path d="M15 100 Q 40 85, 70 90 T 140 65 L 140 105 L 15 105 Z" fill="url(#chartAreaGrad)" />
    <path d="M15 100 Q 40 85, 70 90 T 140 65" fill="none" stroke="#E05626" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Data points -->
    <circle cx="70" cy="90" r="3" fill="#FFFFFF" stroke="#E05626" stroke-width="2" />
    <circle cx="140" cy="65" r="4" fill="#FFFFFF" stroke="#E05626" stroke-width="2" />
  </g>

  <!-- Floating Holographic Digital Card (Centerpiece) -->
  <g transform="translate(195, 48) rotate(-7)" filter="url(#cardShadow)">
    <!-- Card Body -->
    <rect x="0" y="0" width="190" height="118" rx="14" fill="url(#cardGrad)" />
    <rect x="0" y="0" width="190" height="118" rx="14" fill="url(#cardSheen)" />

    <!-- EMV Chip -->
    <rect x="22" y="24" width="28" height="22" rx="4" fill="url(#goldGrad)" filter="url(#goldShadow)" />
    <path d="M22 35 L50 35 M36 24 L36 46" stroke="#92400E" stroke-width="1" opacity="0.6" />

    <!-- Contactless Wave Icon -->
    <path d="M60 28 A12 12 0 0 1 60 42 M65 24 A18 18 0 0 1 65 46 M70 20 A24 24 0 0 1 70 50" 
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Brand Emblem -->
    <text x="142" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" opacity="0.95">CreditLogic</text>

    <!-- Card Numbers (Obfuscated) -->
    <text x="22" y="78" font-family="'Plus Jakarta Sans', system-ui, monospace" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.9" letter-spacing="1.5">
      ••••  ••••  ••••  8842
    </text>

    <!-- Cardholder Info & Risk Tier -->
    <text x="22" y="100" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" opacity="0.85" letter-spacing="0.5">PREMIUM BORROWER</text>
    <rect x="132" y="88" width="42" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.22" />
    <text x="141" y="100" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF">795 FICO</text>
  </g>

  <!-- Right Floating Metric Gauge Widget -->
  <g transform="translate(325, 125)" filter="url(#softShadow)">
    <rect x="0" y="0" width="145" height="110" rx="14" fill="url(#surfaceGrad)" stroke="#EAE1D5" stroke-width="1.2" />

    <!-- Header -->
    <text x="18" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#7E7165" text-transform="uppercase">CREDIT HEALTH</text>
    
    <!-- Mini Gauge Arc -->
    <path d="M25 78 A40 40 0 0 1 120 78" fill="none" stroke="#EAE1D5" stroke-width="8" stroke-linecap="round" />
    <path d="M25 78 A40 40 0 0 1 106 50" fill="none" stroke="url(#gaugeArcGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Center text in gauge -->
    <text x="72" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2A221C">EXCELLENT</text>
    <text x="72" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803D">Tier 1 &bull; Low Risk</text>
  </g>

  <!-- Floating Approved Badge Pill (Foreground Accent) -->
  <g transform="translate(180, 205)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="158" height="38" rx="19" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
    <circle cx="20" cy="19" r="11" fill="url(#emeraldGrad)" />
    <!-- Checkmark -->
    <path d="M16 19 L19 22 L25 15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="38" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803D">AUTO-APPROVED</text>
    <text x="135" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">98%</text>
  </g>

  <!-- Floating Golden Coin Token (Top Right Accent) -->
  <g transform="translate(425, 45)" filter="url(#goldShadow)">
    <circle cx="20" cy="20" r="18" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="2" />
    <circle cx="20" cy="20" r="14" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
    <text x="20" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="900" fill="#78350F">$</text>
  </g>

  <!-- Decorative Sparkles / Floating Stars -->
  <!-- Star 1 (Left) -->
  <path d="M48 65 Q 48 75, 38 75 Q 48 75, 48 85 Q 48 75, 58 75 Q 48 75, 48 65" fill="#E05626" opacity="0.75" />
  <!-- Star 2 (Right Top) -->
  <path d="M375 25 Q 375 33, 367 33 Q 375 33, 375 41 Q 375 33, 383 33 Q 375 33, 375 25" fill="#F59E0B" opacity="0.8" />
  <!-- Star 3 (Bottom Center) -->
  <path d="M155 170 Q 155 176, 149 176 Q 155 176, 155 182 Q 155 176, 161 176 Q 155 176, 155 170" fill="#10B981" opacity="0.8" />

  <!-- Data particles -->
  <circle cx="185" cy="40" r="3" fill="#E05626" opacity="0.4" />
  <circle cx="340" cy="100" r="2.5" fill="#F59E0B" opacity="0.5" />
  <circle cx="470" cy="180" r="3" fill="#10B981" opacity="0.4" />
  <circle cx="85" cy="225" r="2.5" fill="#E05626" opacity="0.35" />
</svg>
